# Agente IA para Turismo es Vida SAS
name = "turismo-es-vida-agente"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Workers AI
[ai]
binding = "IA"

# Variables de entorno del Worker
[vars]
MODELO = "@cf/meta/llama-3.1-8b-instruct-awq"

# Limite de peticiones por IP (Workers KV)
[[kv_namespaces]]
binding = "RATELIMIT"
id = "d387c27b55144c30a035b91a4a10d5ad"

# Contactos del chat
[[d1_databases]]
binding = "AGENTE_LEADS"
database_name = "turismo-es-vida-leads"
database_id = "95235b26-2b3d-4f1a-8e8f-14c01892f11e"

# El CSS del widget se sirve como texto
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

# El JS del widget se sirve como texto plano
[[rules]]
type = "Text"
globs = ["**/*.txt"]
fallthrough = true